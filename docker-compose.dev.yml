services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    ports:
      - "8010:8000"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

volumes:
  backend_vendor:
  backend_storage:
