name: yaaydoom-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${DOCKER_IMAGE:-lingueredev/yaaydoom-backend:latest}"
    container_name: yaaydoom-backend
    env_file:
      - .env
    environment:
      APP_URL: http://127.0.0.1:${APP_PORT:-8000}
      L5_SWAGGER_CONST_HOST: http://127.0.0.1:${APP_PORT:-8000}
      USE_MOCK_DATA: "${USE_MOCK_DATA:-true}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_PASSPORT_SETUP: "${RUN_PASSPORT_SETUP:-true}"
      SKIP_PASSPORT_SETUP: "${SKIP_PASSPORT_SETUP:-false}"
    volumes:
      - .:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

volumes:
  backend_vendor:
  backend_storage:
